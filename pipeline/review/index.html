<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VegBatch — recipe review</title>
<style>
  :root {
    --bg: #faf8f5;
    --panel: #ffffff;
    --ink: #22201d;
    --muted: #6d6660;
    --line: #e3ddd5;
    --accent: #3f6f4f;
    --accent-soft: #eaf1ec;
    --warn: #9a6512;
    --warn-soft: #fdf3e2;
    --alert: #9c3a2f;
    --alert-soft: #fbeceb;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--bg);
    display: grid; grid-template-rows: auto 1fr;
  }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 620; letter-spacing: -0.01em; }
  header .spacer { flex: 1; }
  .progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .bar { width: 160px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

  select, button, input, textarea {
    font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); padding: 5px 8px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 560; }
  button.primary:hover { filter: brightness(1.08); }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  main { display: grid; grid-template-columns: 340px minmax(420px, 1fr) minmax(460px, 1.1fr); min-height: 0; }

  /* ---- list ---- */
  .list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .list .filter { position: sticky; top: 0; background: var(--panel); padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
  .list .filter select { flex: 1; }
  .row {
    padding: 9px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  }
  .row:hover { background: var(--bg); }
  .row.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .row .id { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .t { color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--accent); }
  .dot.review { background: var(--warn); }
  .dot.alert { background: var(--alert); }

  /* ---- photo ---- */
  .photo { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; background: #f0ece6; }
  .photo .tools { display: flex; gap: 6px; padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .photo .stage { flex: 1; overflow: auto; display: grid; place-items: center; padding: 12px; }
  .photo img { max-width: 100%; max-height: 100%; border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,.14); transition: transform .15s; }
  .photo img.zoom { max-width: none; max-height: none; width: 190%; cursor: zoom-out; }
  .photo img:not(.zoom) { cursor: zoom-in; }

  /* ---- form ---- */
  .form { overflow-y: auto; padding: 16px 20px 80px; }
  .form h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; font-weight: 620; }
  .form h2:first-child { margin-top: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field { margin-bottom: 10px; }
  .field input, .field textarea, .field select { width: 100%; }
  textarea { resize: vertical; min-height: 58px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .banner { padding: 9px 11px; border-radius: var(--radius); margin-bottom: 10px; font-size: 13px; }
  .banner.warn { background: var(--warn-soft); border: 1px solid #edd9b2; color: var(--warn); }
  .banner.alert { background: var(--alert-soft); border: 1px solid #f0cdc8; color: var(--alert); }
  .banner.info { background: var(--accent-soft); border: 1px solid #cfe0d4; color: var(--accent); }
  .banner b { font-weight: 620; }
  .banner ul { margin: 5px 0 0; padding-left: 18px; }

  .ing { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; margin-bottom: 7px; background: var(--panel); }
  .ing.est { border-color: #e6c88a; background: var(--warn-soft); }
  .ing.sub { border-color: #cfe0d4; background: var(--accent-soft); }
  .ing .qty { display: grid; grid-template-columns: 62px 62px 96px 1fr; gap: 6px; }
  .ing .meta { display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .ing .raw { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: ui-monospace, monospace; word-break: break-word; }
  .ing .why { font-size: 12px; color: var(--warn); margin-top: 4px; }
  .ing .prep { margin-top: 6px; }
  .chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--muted); font-weight: 560; }
  .chip.est { background: #eccf96; color: #5d3f05; }
  .chip.sub { background: #bcd6c3; color: #244c31; }
  .chk { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .chk input { width: auto; }

  .step { display: grid; grid-template-columns: 26px 1fr; gap: 8px; margin-bottom: 7px; align-items: start; }
  .step .n { color: var(--muted); text-align: right; padding-top: 7px; font-variant-numeric: tabular-nums; }

  .actions {
    position: sticky; bottom: 0; margin: 20px -20px -80px; padding: 12px 20px;
    background: linear-gradient(transparent, var(--bg) 22%); display: flex; gap: 8px; align-items: center;
  }
  .hint { color: var(--muted); font-size: 12px; }
  kbd { font: inherit; font-size: 11px; background: var(--line); border-radius: 4px; padding: 1px 5px; }
  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .saved { color: var(--accent); font-size: 12px; opacity: 0; transition: opacity .2s; }
  .saved.on { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>VegBatch · recipe review</h1>
  <div class="bar"><i id="barfill"></i></div>
  <span class="progress" id="progress">—</span>
  <span class="spacer"></span>
  <span class="hint"><kbd>J</kbd>/<kbd>K</kbd> move · <kbd>R</kbd> rotate · <kbd>Ctrl</kbd>+<kbd>↵</kbd> approve &amp; next</span>
</header>

<main>
  <nav class="list">
    <div class="filter">
      <select id="filter">
        <option value="all">All recipes</option>
        <option value="review" selected>Needs review</option>
        <option value="estimated">Estimated quantities</option>
        <option value="edits">Household edits applied</option>
        <option value="substituted">Meat substituted</option>
        <option value="excluded">Excluded</option>
        <option value="notveg">Still contains meat / fish</option>
        <option value="drafted">Drafted method</option>
        <option value="done">Approved</option>
      </select>
    </div>
    <div id="rows"></div>
  </nav>

  <section class="photo">
    <div class="tools">
      <span id="pagetabs" style="display:flex;gap:4px"></span>
      <span class="spacer" style="flex:1"></span>
      <button id="rotate" title="Rotate (R)">⟳ Rotate</button>
    </div>
    <div class="stage"><img id="img" alt="recipe page"></div>
  </section>

  <section class="form" id="form"><div class="empty">Select a recipe.</div></section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
